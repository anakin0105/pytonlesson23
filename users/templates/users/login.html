{% extends 'catalog/base.html' %}

{% block title %}Вход в Skystore{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white py-4 text-center">
                    <h4 class="mb-0 fw-bold">Вход в аккаунт</h4>
                </div>

                <div class="card-body p-5">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold py-3">
                                Войти
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            Нет аккаунта?
                            <a href="{% url 'users:register' %}" class="text-primary fw-medium">
                                Зарегистрироваться
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
